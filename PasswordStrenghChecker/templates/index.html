<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Password Strength Checker</h1>
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="checkPassword()">Check</button>
    <div id="strengthText" class="strength"></div>
    <ul id="feedbackList" class="feedback"></ul>
    <!-- <img src="/static/hacker.png" alt="Hacker" class="hacker-img"/> -->
  </div>

  <script>
    function checkPassword() {
      const password = document.getElementById("password").value;
      const strengthText = document.getElementById("strengthText");
      const feedbackList = document.getElementById("feedbackList");

      strengthText.textContent = "";
      strengthText.className = "strength";
      feedbackList.innerHTML = "";

      if (!password) return;

      const feedback = [];
      let strength = "Weak";
      let score = 0;

      if (password.length >= 8) score++;
      else feedback.push("Password is too short (minimum 8 characters).");

      if (/[A-Z]/.test(password)) score++;
      else feedback.push("Add uppercase letters.");

      if (/\d/.test(password)) score++;
      else feedback.push("Add numbers.");

      if (/[^A-Za-z0-9]/.test(password)) score++;
      else feedback.push("Add special characters (!@#$ etc.).");

      if (score >= 4) strength = "Strong";
      else if (score === 3) strength = "Medium";

      strengthText.textContent = `Strength: ${strength}`;
      strengthText.classList.add(strength.toLowerCase());

      feedback.forEach(f => {
        const li = document.createElement("li");
        li.textContent = f;
        feedbackList.appendChild(li);
      });
    }
  </script>
</body>
</html>
